<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" id="app-viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <script>
      (function() {
        try {
          var ua = navigator.userAgent || '';
          var isTvUA = /Android.*TV|SMART-TV|AFT|GoogleTV|Chromecast|BRAVIA|MIBOX|SHIELD|Nexus Player|Leanback/i.test(ua);
          var isAndroid = /Android/i.test(ua);
          var isTv = isTvUA || (isAndroid && window.innerWidth > window.innerHeight && navigator.maxTouchPoints === 0);
          if (isTv) {
            document.documentElement.classList.add('is-tv');
          }
          var savedZoom = null;
          try {
            var raw = localStorage.getItem('tgvideo_device_pixel_zoom');
            if (raw && raw !== 'auto') {
              var n = parseFloat(raw);
              if (!isNaN(n) && n >= 0.4 && n <= 1.6) savedZoom = n;
            }
          } catch (_) {}

          if (savedZoom !== null) {
            document.documentElement.style.zoom = savedZoom.toFixed(3);
          } else if (isTv) {
            var w = window.innerWidth;
            if (w > 0 && w < 1500) {
              var factor = Math.min(1.0, Math.max(0.60, w / 1440));
              document.documentElement.style.zoom = factor.toFixed(3);
            }
          }
        } catch (_) {}
      })();
    </script>
    <meta name="theme-color" content="#0f0f0f" />
    <title>TGVideo</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="TGVideo" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
