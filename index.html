<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" id="app-viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <script>
      (function() {
        try {
          var ua = navigator.userAgent || '';
          var isTV = /Android.*TV|SMART-TV|AFT|GoogleTV|Chromecast|BRAVIA|MIBOX|SHIELD|Nexus Player|Leanback/i.test(ua) ||
                     (window.innerWidth > window.innerHeight && (navigator.maxTouchPoints === 0 || /Android/i.test(ua)) && window.innerWidth <= 1280);
          if (isTV) {
            var vp = document.getElementById('app-viewport');
            if (vp) {
              vp.setAttribute('content', 'width=1920, initial-scale=1.0, maximum-scale=1.0, user-scalable=no');
            }
            document.documentElement.classList.add('is-tv');
          }
        } catch (_) {}
      })();
    </script>
    <meta name="theme-color" content="#0f0f0f" />
    <title>TGVideo</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="TGVideo" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
