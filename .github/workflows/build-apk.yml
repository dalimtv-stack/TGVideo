name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build web
        env:
          VITE_API_ID: ${{ secrets.VITE_API_ID }}
          VITE_API_HASH: ${{ secrets.VITE_API_HASH }}
          VITE_TMDB_DEMO_API_KEY: ${{ secrets.VITE_TMDB_DEMO_API_KEY }}
        run: npm run build

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        run: |
          ANDROID_HOME=$HOME/android-sdk
          mkdir -p "$ANDROID_HOME/cmdline-tools"

          curl -fsSL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o /tmp/cmdtools.zip
          unzip -q /tmp/cmdtools.zip -d /tmp/cmdtools
          mv /tmp/cmdtools/cmdline-tools "$ANDROID_HOME/cmdline-tools/latest"

          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

      - name: Install SDK packages
        run: |
          mkdir -p "$ANDROID_HOME/licenses"
          printf '%s\n' '24333f8a63b6825ea9c5514f83c2829b004d1fee' > "$ANDROID_HOME/licenses/android-sdk-license"
          sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Capacitor android
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Prepare Android TV & Fire TV Icons and Manifest
        run: |
          SRC="public/icons/icon-512.png"
          RES="android/app/src/main/res"

          if [ -f "$SRC" ]; then
            echo "Inyectando iconos personalizados desde $SRC..."
            mkdir -p "$RES/mipmap-mdpi" "$RES/mipmap-hdpi" "$RES/mipmap-xhdpi" "$RES/mipmap-xxhdpi" "$RES/mipmap-xxxhdpi" "$RES/drawable"

            convert "$SRC" -resize 48x48 "$RES/mipmap-mdpi/ic_launcher.png"
            convert "$SRC" -resize 48x48 "$RES/mipmap-mdpi/ic_launcher_round.png"
            convert "$SRC" -resize 48x48 "$RES/mipmap-mdpi/ic_launcher_foreground.png"

            convert "$SRC" -resize 72x72 "$RES/mipmap-hdpi/ic_launcher.png"
            convert "$SRC" -resize 72x72 "$RES/mipmap-hdpi/ic_launcher_round.png"
            convert "$SRC" -resize 72x72 "$RES/mipmap-hdpi/ic_launcher_foreground.png"

            convert "$SRC" -resize 96x96 "$RES/mipmap-xhdpi/ic_launcher.png"
            convert "$SRC" -resize 96x96 "$RES/mipmap-xhdpi/ic_launcher_round.png"
            convert "$SRC" -resize 96x96 "$RES/mipmap-xhdpi/ic_launcher_foreground.png"

            convert "$SRC" -resize 144x144 "$RES/mipmap-xxhdpi/ic_launcher.png"
            convert "$SRC" -resize 144x144 "$RES/mipmap-xxhdpi/ic_launcher_round.png"
            convert "$SRC" -resize 144x144 "$RES/mipmap-xxhdpi/ic_launcher_foreground.png"

            convert "$SRC" -resize 192x192 "$RES/mipmap-xxxhdpi/ic_launcher.png"
            convert "$SRC" -resize 192x192 "$RES/mipmap-xxxhdpi/ic_launcher_round.png"
            convert "$SRC" -resize 192x192 "$RES/mipmap-xxxhdpi/ic_launcher_foreground.png"

            # Generar banner para Android TV / Fire TV (320x180)
            convert -size 320x180 xc:"#0f0f0f" \
              \( "$SRC" -resize 140x140 \) -gravity center -composite \
              "$RES/drawable/banner.png"
          fi

          # Configurar AndroidManifest.xml para Android TV / Fire TV
          python3 - << 'PYEOF'
          manifest = "android/app/src/main/AndroidManifest.xml"
          with open(manifest, "r", encoding="utf-8") as f:
              c = f.read()

          if "android.software.leanback" not in c:
              features = """
              <uses-feature android:name="android.software.leanback" android:required="false" />
              <uses-feature android:name="android.hardware.touchscreen" android:required="false" />
          """
              c = c.replace("</manifest>", features + "\n</manifest>")

          if "android:banner=" not in c:
              c = c.replace("<application", '<application android:banner="@drawable/banner"')

          if "android.intent.category.LEANBACK_LAUNCHER" not in c:
              orig = '<category android:name="android.intent.category.LAUNCHER" />'
              repl = '<category android:name="android.intent.category.LAUNCHER" />\n                <category android:name="android.intent.category.LEANBACK_LAUNCHER" />'
              c = c.replace(orig, repl)

          with open(manifest, "w", encoding="utf-8") as f:
              f.write(c)
          print("AndroidManifest.xml configurado para TV")
          PYEOF

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: tgvideo-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
