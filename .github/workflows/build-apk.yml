name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build web
        env:
          VITE_API_ID: ${{ secrets.VITE_API_ID }}
          VITE_API_HASH: ${{ secrets.VITE_API_HASH }}
          VITE_TMDB_DEMO_API_KEY: ${{ secrets.VITE_TMDB_DEMO_API_KEY }}
        run: npm run build

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        run: |
          ANDROID_HOME=$HOME/android-sdk
          mkdir -p "$ANDROID_HOME/cmdline-tools"

          curl -fsSL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o /tmp/cmdtools.zip
          unzip -q /tmp/cmdtools.zip -d /tmp/cmdtools
          mv /tmp/cmdtools/cmdline-tools "$ANDROID_HOME/cmdline-tools/latest"

          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

      - name: Install SDK packages
        run: |
          mkdir -p "$ANDROID_HOME/licenses"
          printf '%s\n' '24333f8a63b6825ea9c5514f83c2829b004d1fee' > "$ANDROID_HOME/licenses/android-sdk-license"
          sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Capacitor android
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Prepare Android TV & Fire TV Icons, Banners, and Black Splash
        run: |
          python3 -m pip install pillow --break-system-packages 2>/dev/null || python3 -m pip install pillow || sudo apt-get install -y python3-pil
          python3 - << 'PYEOF'
          import os
          from PIL import Image

          src_path = "public/icons/icon-512.png"
          res_base = "android/app/src/main/res"

          if os.path.exists(src_path):
              print(f"Generando recursos de imagen desde {src_path}...")
              src = Image.open(src_path).convert("RGBA")

              # 1. Iconos del launcher (todas las densidades)
              sizes = {
                  "mipmap-mdpi": 48,
                  "mipmap-hdpi": 72,
                  "mipmap-xhdpi": 96,
                  "mipmap-xxhdpi": 144,
                  "mipmap-xxxhdpi": 192,
              }

              for folder, size in sizes.items():
                  folder_path = os.path.join(res_base, folder)
                  os.makedirs(folder_path, exist_ok=True)
                  resized = src.resize((size, size), Image.Resampling.LANCZOS)
                  for name in ["ic_launcher.png", "ic_launcher_round.png", "ic_launcher_foreground.png"]:
                      resized.save(os.path.join(folder_path, name))

              # Fondo negro para iconos adaptativos
              bg_file = os.path.join(res_base, "values", "ic_launcher_background.xml")
              if os.path.exists(bg_file):
                  with open(bg_file, "w", encoding="utf-8") as f:
                      f.write('<?xml version="1.0" encoding="utf-8"?>\n<resources>\n    <color name="ic_launcher_background">#000000</color>\n</resources>\n')

              # 2. Banner rectangular 16:9 para Android TV y Fire TV (320x180)
              for draw_dir in ["drawable", "drawable-xhdpi", "drawable-hdpi", "drawable-xxhdpi"]:
                  dp = os.path.join(res_base, draw_dir)
                  os.makedirs(dp, exist_ok=True)
                  banner = Image.new("RGBA", (320, 180), (0, 0, 0, 255))
                  icon_tv = src.resize((140, 140), Image.Resampling.LANCZOS)
                  offset = ((320 - 140) // 2, (180 - 140) // 2)
                  banner.paste(icon_tv, offset, icon_tv)
                  banner.save(os.path.join(dp, "banner.png"))
                  banner.save(os.path.join(dp, "tv_banner.png"))

              # 3. Splash Screen con logo de TGVideo sobre fondo negro puro
              for root, dirs, files in os.walk(res_base):
                  for f in files:
                      if f.lower() == "splash.png":
                          full_path = os.path.join(root, f)
                          try:
                              orig = Image.open(full_path)
                              w, h = orig.size
                              splash_img = Image.new("RGBA", (w, h), (0, 0, 0, 255))
                              icon_dim = min(int(min(w, h) * 0.45), 512)
                              icon_dim = max(icon_dim, 64)
                              icon_splash = src.resize((icon_dim, icon_dim), Image.Resampling.LANCZOS)
                              off = ((w - icon_dim) // 2, (h - icon_dim) // 2)
                              splash_img.paste(icon_splash, off, icon_splash)
                              splash_img.save(full_path)
                              print(f"Splash reemplazado: {full_path}")
                          except Exception as e:
                              print(f"Error procesando {full_path}: {e}")

              print("Iconos, banner rectangular y splash negro configurados.")
          else:
              print(f"Aviso: No se encontró {src_path}")

          manifest = "android/app/src/main/AndroidManifest.xml"
          if os.path.exists(manifest):
              with open(manifest, "r", encoding="utf-8") as f:
                  c = f.read()

              if "android.software.leanback" not in c:
                  features = """
              <uses-feature android:name="android.software.leanback" android:required="false" />
              <uses-feature android:name="android.hardware.touchscreen" android:required="false" />
          """
                  c = c.replace("</manifest>", features + "\n</manifest>")

              if 'android:banner="@drawable/banner"' not in c:
                  c = c.replace("<application", '<application android:banner="@drawable/banner"')
                  c = c.replace("<activity", '<activity android:banner="@drawable/banner"')

              if "android.intent.category.LEANBACK_LAUNCHER" not in c:
                  orig = '<category android:name="android.intent.category.LAUNCHER" />'
                  repl = '<category android:name="android.intent.category.LAUNCHER" />\n                <category android:name="android.intent.category.LEANBACK_LAUNCHER" />'
                  c = c.replace(orig, repl)

              with open(manifest, "w", encoding="utf-8") as f:
                  f.write(c)
              print("AndroidManifest.xml configurado para TV y banner rectangular")
          PYEOF

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: tgvideo-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
