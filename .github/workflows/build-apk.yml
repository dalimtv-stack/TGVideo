name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: '¿Publicar como Release oficial en GitHub?'
        required: false
        type: boolean
        default: false
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build web
        env:
          VITE_API_ID: ${{ secrets.VITE_API_ID }}
          VITE_API_HASH: ${{ secrets.VITE_API_HASH }}
          VITE_TMDB_DEMO_API_KEY: ${{ secrets.VITE_TMDB_DEMO_API_KEY }}
        run: npm run build

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        run: |
          ANDROID_HOME=$HOME/android-sdk
          mkdir -p "$ANDROID_HOME/cmdline-tools"

          curl -fsSL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o /tmp/cmdtools.zip
          unzip -q /tmp/cmdtools.zip -d /tmp/cmdtools
          mv /tmp/cmdtools/cmdline-tools "$ANDROID_HOME/cmdline-tools/latest"

          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

      - name: Install SDK packages
        run: |
          mkdir -p "$ANDROID_HOME/licenses"
          printf '%s\n' '24333f8a63b6825ea9c5514f83c2829b004d1fee' > "$ANDROID_HOME/licenses/android-sdk-license"
          sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Capacitor android
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Prepare Android TV Icons, Banner 16:9, Manifest & ExoPlayer Integration
        run: |
          pip install Pillow
          python3 - << 'PYEOF'
          import os, re, shutil
          from PIL import Image

          src_path = "public/icons/icon-512.png"
          res_base = "android/app/src/main/res"

          if os.path.exists(src_path):
              print(f"Generando iconos y splash desde {src_path}...")
              src = Image.open(src_path).convert("RGBA")

              sizes = {
                  "mipmap-mdpi": 48,
                  "mipmap-hdpi": 72,
                  "mipmap-xhdpi": 96,
                  "mipmap-xxhdpi": 144,
                  "mipmap-xxxhdpi": 192,
              }

              for folder, size in sizes.items():
                  folder_path = os.path.join(res_base, folder)
                  os.makedirs(folder_path, exist_ok=True)
                  resized = src.resize((size, size), Image.Resampling.LANCZOS)
                  for name in ["ic_launcher.png", "ic_launcher_round.png", "ic_launcher_foreground.png"]:
                      resized.save(os.path.join(folder_path, name))

              drawable_path = os.path.join(res_base, "drawable")
              os.makedirs(drawable_path, exist_ok=True)

              # Banner Android TV / Fire TV 16:9: prioridad a icon-landscape.alt2.png
              landscape_candidates = [
                  "public/icons/icon-landscape.alt2.png",
                  "public/icons/icon-landscape.alt.png",
                  "public/icons/icon-landscape.png"
              ]
              landscape_src = next((p for p in landscape_candidates if os.path.exists(p)), None)

              if landscape_src:
                  print(f"Usando icono landscape 16:9 oficial desde {landscape_src}...")
                  b_src = Image.open(landscape_src).convert("RGBA")

                  banner_densities = {
                      "drawable": (320, 180),
                      "drawable-mdpi": (160, 90),
                      "drawable-hdpi": (240, 135),
                      "drawable-tvdpi": (213, 120),
                      "drawable-xhdpi": (320, 180),
                      "drawable-xxhdpi": (480, 270),
                      "drawable-xxxhdpi": (640, 360),
                      "mipmap-mdpi": (160, 90),
                      "mipmap-hdpi": (240, 135),
                      "mipmap-xhdpi": (320, 180),
                      "mipmap-xxhdpi": (480, 270),
                      "mipmap-xxxhdpi": (640, 360),
                  }
                  for folder, (bw, bh) in banner_densities.items():
                      b_path = os.path.join(res_base, folder)
                      os.makedirs(b_path, exist_ok=True)
                      b_res = b_src.resize((bw, bh), Image.Resampling.LANCZOS)
                      b_res.save(os.path.join(b_path, "banner.png"))
              else:
                  from PIL import ImageOps
                  banner = ImageOps.fit(src, (320, 180), Image.Resampling.LANCZOS)
                  banner.save(os.path.join(drawable_path, "banner.png"))

              # Reemplazar splash de Capacitor
              for root, dirs, files in os.walk(res_base):
                  for file in files:
                      if file.lower() == "splash.png":
                          target_splash = os.path.join(root, file)
                          try:
                              with Image.open(target_splash) as existing:
                                  w, h = existing.size
                              splash_bg = Image.new("RGBA", (w, h), (20, 20, 20, 255))
                              icon_size = min(w, h) // 3
                              icon_splash = src.resize((icon_size, icon_size), Image.Resampling.LANCZOS)
                              sp_offset = ((w - icon_size) // 2, (h - icon_size) // 2)
                              splash_bg.paste(icon_splash, sp_offset, icon_splash)
                              splash_bg.save(target_splash)
                          except Exception as e:
                              print(f"Error actualizando splash: {e}")

              print("Iconos, banner 16:9 y splash screens listos.")

          manifest_path = "android/app/src/main/AndroidManifest.xml"
          if os.path.exists(manifest_path):
              with open(manifest_path, "r", encoding="utf-8") as f:
                  m = f.read()

              if "android.software.leanback" not in m:
                  m = re.sub(
                      r'(<manifest[^>]*>)',
                      r'\1\n    <uses-feature android:name="android.software.leanback" android:required="false" />\n    <uses-feature android:name="android.hardware.touchscreen" android:required="false" />',
                      m,
                      count=1
                  )

              # Configurar banner y permitir tráfico cleartext en localhost para streaming de ExoPlayer
              if 'android:banner=' not in m:
                  m = re.sub(r'<application\b', '<application android:banner="@drawable/banner" android:logo="@drawable/banner" android:usesCleartextTraffic="true" android:isGame="false"', m, count=1)
              elif 'android:usesCleartextTraffic=' not in m:
                  m = re.sub(r'<application\b', '<application android:usesCleartextTraffic="true"', m, count=1)

              def inject_activity_banner(match):
                  tag = match.group(0)
                  if 'android:banner=' not in tag:
                      return re.sub(r'>$', ' android:banner="@drawable/banner" android:logo="@drawable/banner">', tag)
                  return tag

              m = re.sub(r'<activity\b[^>]*MainActivity[^>]*>', inject_activity_banner, m, count=1)

              if "LEANBACK_LAUNCHER" not in m:
                  leanback_filter = """            <intent-filter>
                <action android:name="android.intent.action.MAIN" />
                <category android:name="android.intent.category.LEANBACK_LAUNCHER" />
            </intent-filter>"""
                  m = re.sub(
                      r'(<intent-filter\b[^>]*>[\s\S]*?android\.intent\.category\.LAUNCHER[\s\S]*?</intent-filter>)',
                      leanback_filter + r'\n            \1',
                      m,
                      count=1
                  )

              with open(manifest_path, "w", encoding="utf-8") as f:
                  f.write(m)
              print("AndroidManifest.xml configurado para Leanback / Android TV y cleartextTraffic.")

          # Fondo negro para estilos
          for styles_path in ["android/app/src/main/res/values/styles.xml", "android/app/src/main/res/values-night/styles.xml"]:
              if os.path.exists(styles_path):
                  with open(styles_path, "r", encoding="utf-8") as f:
                      st = f.read()
                  if "android:windowBackground" in st:
                      st = re.sub(r'<item name="android:windowBackground">[^<]+</item>', '<item name="android:windowBackground">@android:color/black</item>', st)
                  else:
                      st = st.replace("</style>", '    <item name="android:windowBackground">@android:color/black</item>\n    </style>')
                  with open(styles_path, "w", encoding="utf-8") as f:
                      f.write(st)

          # Inyectar dependencias de ExoPlayer (Media3) en build.gradle
          app_gradle = "android/app/build.gradle"
          if os.path.exists(app_gradle):
              with open(app_gradle, "r", encoding="utf-8") as f:
                  g = f.read()
              if "androidx.media3:media3-exoplayer" not in g:
                  media3_deps = """
              implementation 'androidx.media3:media3-exoplayer:1.5.1'
              implementation 'androidx.media3:media3-ui:1.5.1'
              implementation 'androidx.media3:media3-common:1.5.1'
                  """
                  g = re.sub(r'dependencies\s*\{', 'dependencies {' + media3_deps, g, count=1)
                  with open(app_gradle, "w", encoding="utf-8") as f:
                      f.write(g)
                  print("Dependencias de ExoPlayer Media3 agregadas a build.gradle.")

          layout_dir = "android/app/src/main/res/layout"
          os.makedirs(layout_dir, exist_ok=True)
          layout_file = os.path.join(layout_dir, "exo_player_layout.xml")
          layout_code = """<?xml version="1.0" encoding="utf-8"?>
          <androidx.media3.ui.PlayerView
              xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:app="http://schemas.android.com/apk/res-auto"
              android:id="@+id/exo_player_view"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              app:surface_type="texture_view"
              app:use_controller="false"
              app:resize_mode="fit" />"""
          with open(layout_file, "w", encoding="utf-8") as f:
              f.write(layout_code)
          print("exo_player_layout.xml inyectado con surface_type=texture_view.")

          # Inyectar servidor local y plugin nativo ExoPlayer en com.tgvideo.app
          java_pkg_dir = "android/app/src/main/java/com/tgvideo/app"
          os.makedirs(java_pkg_dir, exist_ok=True)

          # 1. LocalStreamServer.java
          server_file = os.path.join(java_pkg_dir, "LocalStreamServer.java")
          server_code = """package com.tgvideo.app;

          import java.io.ByteArrayOutputStream;
          import java.io.InputStream;
          import java.io.OutputStream;
          import java.net.InetAddress;
          import java.net.ServerSocket;
          import java.net.Socket;
          import java.nio.charset.StandardCharsets;
          import java.util.Map;
          import java.util.UUID;
          import java.util.concurrent.ConcurrentHashMap;
          import java.util.concurrent.CompletableFuture;
          import java.util.concurrent.TimeUnit;

          public class LocalStreamServer {
              public interface RangeListener {
                  void onNeedRange(String streamId, long start, long end, String requestId);
              }

              public static class StreamMeta {
                  public String id;
                  public long size;
                  public String mime;
                  public String name;
                  public StreamMeta(String id, long size, String mime, String name) {
                      this.id = id;
                      this.size = size;
                      this.mime = mime != null ? mime : "video/mp4";
                      this.name = name != null ? name : "video";
                  }
              }

              private ServerSocket serverSocket;
              private Thread serverThread;
              private volatile boolean running = false;
              private int port = 0;
              private RangeListener listener;
              private final Map<String, StreamMeta> streams = new ConcurrentHashMap<>();
              private final Map<String, CompletableFuture<byte[]>> pendingChunks = new ConcurrentHashMap<>();

              public LocalStreamServer(RangeListener listener) {
                  this.listener = listener;
              }

              public synchronized int start() {
                  if (running && serverSocket != null && !serverSocket.isClosed()) {
                      return port;
                  }
                  try {
                      serverSocket = new ServerSocket(0, 50, InetAddress.getByName("127.0.0.1"));
                      port = serverSocket.getLocalPort();
                      running = true;
                      serverThread = new Thread(this::listenLoop, "LocalStreamServer");
                      serverThread.setDaemon(true);
                      serverThread.start();
                      return port;
                  } catch (Exception e) {
                      e.printStackTrace();
                      return -1;
                  }
              }

              public synchronized void stop() {
                  running = false;
                  try {
                      if (serverSocket != null) serverSocket.close();
                  } catch (Exception ignored) {}
                  streams.clear();
                  cleanPending();
                  try {
                      workerPool.shutdownNow();
                  } catch (Exception ignored) {}
              }

              public void registerStream(String id, long size, String mime, String name) {
                  streams.put(id, new StreamMeta(id, size, mime, name));
              }

              public void putChunk(String requestId, byte[] data) {
                  CompletableFuture<byte[]> future = pendingChunks.remove(requestId);
                  if (future != null) {
                      future.complete(data);
                  }
              }

              public void failChunk(String requestId) {
                  CompletableFuture<byte[]> future = pendingChunks.remove(requestId);
                  if (future != null) {
                      future.complete(new byte[0]);
                  }
              }

              private final java.util.concurrent.ExecutorService workerPool = java.util.concurrent.Executors.newFixedThreadPool(6);

              public void cleanPending() {
                  for (CompletableFuture<byte[]> f : pendingChunks.values()) {
                      f.complete(new byte[0]);
                  }
                  pendingChunks.clear();
              }

              private void listenLoop() {
                  while (running && serverSocket != null && !serverSocket.isClosed()) {
                      try {
                          Socket client = serverSocket.accept();
                          workerPool.execute(() -> handleConnection(client));
                      } catch (Exception e) {
                          if (!running) break;
                      }
                  }
              }

              private void handleConnection(Socket socket) {
                  try {
                      socket.setSoTimeout(30000);
                      InputStream in = socket.getInputStream();
                      OutputStream out = socket.getOutputStream();

                      ByteArrayOutputStream headerBuf = new ByteArrayOutputStream();
                      int b;
                      int matches = 0;
                      while ((b = in.read()) != -1) {
                          headerBuf.write(b);
                          if ((matches == 0 || matches == 2) && b == '\\r') matches++;
                          else if ((matches == 1 || matches == 3) && b == '\\n') matches++;
                          else matches = 0;
                          if (matches == 4) break;
                      }

                      String headerStr = new String(headerBuf.toByteArray(), StandardCharsets.ISO_8859_1);
                      String[] lines = headerStr.split("\\r\\n");
                      if (lines.length == 0) { socket.close(); return; }

                      String[] parts = lines[0].split(" ");
                      if (parts.length < 2) { socket.close(); return; }

                      String method = parts[0];
                      String uri = parts[1];

                      if ("OPTIONS".equalsIgnoreCase(method)) {
                          String resp = "HTTP/1.1 204 No Content\\r\\n" +
                                  "Access-Control-Allow-Origin: *\\r\\n" +
                                  "Access-Control-Allow-Methods: GET, POST, OPTIONS\\r\\n" +
                                  "Access-Control-Allow-Headers: Content-Type, Range\\r\\n" +
                                  "Access-Control-Max-Age: 600\\r\\n" +
                                  "Content-Length: 0\\r\\nConnection: close\\r\\n\\r\\n";
                          out.write(resp.getBytes(StandardCharsets.ISO_8859_1));
                          out.flush();
                          socket.close();
                          return;
                      }

                      if ("POST".equalsIgnoreCase(method) && uri.startsWith("/chunk")) {
                          int qIdx = uri.indexOf("requestId=");
                          String reqId = qIdx != -1 ? uri.substring(qIdx + 10) : "";
                          int ampIdx = reqId.indexOf('&');
                          if (ampIdx != -1) reqId = reqId.substring(0, ampIdx);

                          int contentLength = 0;
                          for (String line : lines) {
                              if (line.toLowerCase().startsWith("content-length:")) {
                                  contentLength = Integer.parseInt(line.substring(15).trim());
                              }
                          }

                          ByteArrayOutputStream bodyBuf = new ByteArrayOutputStream();
                          if (contentLength > 0) {
                              byte[] buf = new byte[8192];
                              int readTotal = 0;
                              while (readTotal < contentLength) {
                                  int r = in.read(buf, 0, Math.min(buf.length, contentLength - readTotal));
                                  if (r == -1) break;
                                  bodyBuf.write(buf, 0, r);
                                  readTotal += r;
                              }
                          }

                          putChunk(reqId, bodyBuf.toByteArray());
                          String resp = "HTTP/1.1 200 OK\\r\\nAccess-Control-Allow-Origin: *\\r\\nContent-Length: 0\\r\\nConnection: close\\r\\n\\r\\n";
                          out.write(resp.getBytes(StandardCharsets.ISO_8859_1));
                          out.flush();
                          socket.close();
                          return;
                      }

                      if ("POST".equalsIgnoreCase(method) && uri.startsWith("/error")) {
                          int qIdx = uri.indexOf("requestId=");
                          String reqId = qIdx != -1 ? uri.substring(qIdx + 10) : "";
                          int ampIdx = reqId.indexOf('&');
                          if (ampIdx != -1) reqId = reqId.substring(0, ampIdx);
                          failChunk(reqId);
                          String resp = "HTTP/1.1 200 OK\\r\\nAccess-Control-Allow-Origin: *\\r\\nContent-Length: 0\\r\\nConnection: close\\r\\n\\r\\n";
                          out.write(resp.getBytes(StandardCharsets.ISO_8859_1));
                          out.flush();
                          socket.close();
                          return;
                      }

                      if (!uri.startsWith("/stream/")) {
                          String resp = "HTTP/1.1 404 Not Found\\r\\nContent-Length: 0\\r\\n\\r\\n";
                          out.write(resp.getBytes(StandardCharsets.ISO_8859_1));
                          out.flush();
                          socket.close();
                          return;
                      }

                      String pathAfter = uri.substring(8);
                      int slashIdx = pathAfter.indexOf('/');
                      String streamId = slashIdx != -1 ? pathAfter.substring(0, slashIdx) : pathAfter;

                      StreamMeta meta = streams.get(streamId);
                      if (meta == null) {
                          String resp = "HTTP/1.1 404 Stream Not Found\\r\\nContent-Length: 0\\r\\n\\r\\n";
                          out.write(resp.getBytes(StandardCharsets.ISO_8859_1));
                          out.flush();
                          socket.close();
                          return;
                      }

                      long totalSize = meta.size;
                      long start = 0;
                      long end = totalSize - 1;
                      boolean hasRange = false;

                      for (String line : lines) {
                          if (line.toLowerCase().startsWith("range:")) {
                              hasRange = true;
                              String rVal = line.substring(6).trim();
                              if (rVal.startsWith("bytes=")) {
                                  rVal = rVal.substring(6).trim();
                                  String[] rParts = rVal.split("-");
                                  if (rParts.length > 0 && !rParts[0].isEmpty()) {
                                      start = Long.parseLong(rParts[0]);
                                  }
                                  if (rParts.length > 1 && !rParts[1].isEmpty()) {
                                      end = Long.parseLong(rParts[1]);
                                  }
                              }
                          }
                      }

                      if (start >= totalSize) {
                          String resp = "HTTP/1.1 416 Range Not Satisfiable\\r\\nContent-Range: bytes */" + totalSize + "\\r\\n\\r\\n";
                          out.write(resp.getBytes(StandardCharsets.ISO_8859_1));
                          out.flush();
                          socket.close();
                          return;
                      }

                      long blockSize = 2L * 1024L * 1024L;
                      if (end - start + 1 > blockSize) {
                          end = Math.min(totalSize - 1, start + blockSize - 1);
                      }

                      String reqId = UUID.randomUUID().toString();
                      CompletableFuture<byte[]> chunkFuture = new CompletableFuture<>();
                      pendingChunks.put(reqId, chunkFuture);

                      if (listener != null) {
                          listener.onNeedRange(streamId, start, end, reqId);
                      }

                      byte[] chunkData;
                      try {
                          chunkData = chunkFuture.get(25, TimeUnit.SECONDS);
                      } catch (Exception e) {
                          pendingChunks.remove(reqId);
                          String resp = "HTTP/1.1 504 Gateway Timeout\\r\\nContent-Length: 0\\r\\n\\r\\n";
                          out.write(resp.getBytes(StandardCharsets.ISO_8859_1));
                          out.flush();
                          socket.close();
                          return;
                      }

                      if (chunkData == null) chunkData = new byte[0];

                      StringBuilder sb = new StringBuilder();
                      if (hasRange) {
                          sb.append("HTTP/1.1 206 Partial Content\\r\\n");
                          sb.append("Content-Range: bytes ").append(start).append("-").append(start + chunkData.length - 1).append("/").append(totalSize).append("\\r\\n");
                      } else {
                          sb.append("HTTP/1.1 200 OK\\r\\n");
                      }
                      sb.append("Content-Type: ").append(meta.mime).append("\\r\\n");
                      sb.append("Content-Length: ").append(chunkData.length).append("\\r\\n");
                      sb.append("Accept-Ranges: bytes\\r\\n");
                      sb.append("Access-Control-Allow-Origin: *\\r\\n");
                      sb.append("Connection: close\\r\\n\\r\\n");

                      out.write(sb.toString().getBytes(StandardCharsets.ISO_8859_1));
                      out.write(chunkData);
                      out.flush();
                      socket.close();
                  } catch (Exception e) {
                      try { socket.close(); } catch (Exception ignored) {}
                  }
              }
          }
          """
          with open(server_file, "w", encoding="utf-8") as f:
              f.write(server_code)
          print("LocalStreamServer.java inyectado exitosamente.")

          # 2. ExoPlayerPlugin.java
          plugin_file = os.path.join(java_pkg_dir, "ExoPlayerPlugin.java")
          plugin_code = """package com.tgvideo.app;

          import android.graphics.Color;
          import android.net.Uri;
          import android.os.Handler;
          import android.os.Looper;
          import android.view.ViewGroup;
          import android.widget.FrameLayout;

          import androidx.media3.common.C;
          import androidx.media3.common.MediaItem;
          import androidx.media3.common.Player;
          import androidx.media3.common.Tracks;
          import androidx.media3.common.TrackSelectionOverride;
          import androidx.media3.exoplayer.ExoPlayer;
          import androidx.media3.exoplayer.trackselection.DefaultTrackSelector;
          import androidx.media3.ui.AspectRatioFrameLayout;
          import androidx.media3.ui.PlayerView;

          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;

          @CapacitorPlugin(name = "ExoPlayerPlugin")
          public class ExoPlayerPlugin extends Plugin {
              private ExoPlayer player;
              private PlayerView playerView;
              private DefaultTrackSelector trackSelector;
              private LocalStreamServer streamServer;
              private Handler progressHandler;
              private Runnable progressRunnable;
              private boolean isPlaying = false;

              @Override
              public void load() {
                  super.load();
                  progressHandler = new Handler(Looper.getMainLooper());
                  streamServer = new LocalStreamServer((streamId, start, end, requestId) -> {
                      JSObject ev = new JSObject();
                      ev.put("streamId", streamId);
                      ev.put("start", start);
                      ev.put("end", end);
                      ev.put("requestId", requestId);
                      notifyListeners("needRange", ev);
                  });
                  streamServer.start();
              }

              @PluginMethod
              public void startStreamServer(PluginCall call) {
                  int port = streamServer != null ? streamServer.start() : -1;
                  JSObject res = new JSObject();
                  res.put("port", port);
                  call.resolve(res);
              }

              @PluginMethod
              public void registerStream(PluginCall call) {
                  String id = call.getString("id");
                  long size = call.getData().optLong("size", 0L);
                  String mime = call.getString("mime", "video/mp4");
                  String name = call.getString("name", "video");

                  if (streamServer != null && id != null) {
                      streamServer.registerStream(id, size, mime, name);
                  }
                  JSObject res = new JSObject();
                  res.put("registered", true);
                  call.resolve(res);
              }

              @PluginMethod
              public void play(PluginCall call) {
                  String url = call.getString("url");
                  long resumeAt = (long) (call.getData().optDouble("resumeAt", 0.0) * 1000.0);

                  getActivity().runOnUiThread(() -> {
                      try {
                          if (player == null) {
                              trackSelector = new DefaultTrackSelector(getContext());
                              player = new ExoPlayer.Builder(getContext())
                                      .setTrackSelector(trackSelector)
                                      .build();

                              player.addListener(new Player.Listener() {
                                  @Override
                                  public void onPlaybackStateChanged(int state) {
                                      if (state == Player.STATE_READY) {
                                          JSObject ret = new JSObject();
                                          ret.put("state", "ready");
                                          ret.put("duration", player.getDuration() / 1000.0);
                                          notifyListeners("onReady", ret);
                                      } else if (state == Player.STATE_ENDED) {
                                          notifyListeners("onEnded", new JSObject());
                                      }
                                  }

                                  @Override
                                  public void onIsPlayingChanged(boolean playing) {
                                      isPlaying = playing;
                                      JSObject ret = new JSObject();
                                      ret.put("isPlaying", playing);
                                      notifyListeners("onPlayingChanged", ret);
                                  }
                              });

                              android.view.LayoutInflater inflater = android.view.LayoutInflater.from(getContext());
                              int layoutRes = getContext().getResources().getIdentifier("exo_player_layout", "layout", getContext().getPackageName());
                              if (layoutRes != 0) {
                                  playerView = (PlayerView) inflater.inflate(layoutRes, null);
                              } else {
                                  playerView = new PlayerView(getContext());
                                  playerView.setUseController(false);
                                  playerView.setResizeMode(AspectRatioFrameLayout.RESIZE_MODE_FIT);
                              }
                              playerView.setPlayer(player);

                              ViewGroup parent = (ViewGroup) getBridge().getWebView().getParent();
                              FrameLayout.LayoutParams params = new FrameLayout.LayoutParams(
                                      ViewGroup.LayoutParams.MATCH_PARENT,
                                      ViewGroup.LayoutParams.MATCH_PARENT
                              );
                              int webViewIndex = parent.indexOfChild(getBridge().getWebView());
                              parent.addView(playerView, webViewIndex, params);

                              getBridge().getWebView().setBackgroundColor(Color.TRANSPARENT);
                          }

                          if (url != null) {
                              MediaItem mediaItem = MediaItem.fromUri(Uri.parse(url));
                              player.setMediaItem(mediaItem);
                              if (resumeAt > 0) {
                                  player.seekTo(resumeAt);
                              }
                              player.prepare();
                              player.play();
                          }

                          startProgressTimer();
                          call.resolve();
                      } catch (Exception e) {
                          call.reject("Error al iniciar ExoPlayer: " + e.getMessage());
                      }
                  });
              }

              @PluginMethod
              public void getTracks(PluginCall call) {
                  JSObject result = new JSObject();
                  org.json.JSONArray audio = new org.json.JSONArray();
                  org.json.JSONArray text = new org.json.JSONArray();
                  if (player != null) {
                      Tracks tracks = player.getCurrentTracks();
                      for (int groupIndex = 0; groupIndex < tracks.getGroups().size(); groupIndex++) {
                          Tracks.Group group = tracks.getGroups().get(groupIndex);
                          int type = group.getType();
                          if (type != C.TRACK_TYPE_AUDIO && type != C.TRACK_TYPE_TEXT) continue;
                          for (int trackIndex = 0; trackIndex < group.length; trackIndex++) {
                              androidx.media3.common.Format format = group.getTrackFormat(trackIndex);
                              JSObject item = new JSObject();
                              item.put("group", groupIndex);
                              item.put("track", trackIndex);
                              item.put("language", format.language == null ? "" : format.language);
                              item.put("label", format.label == null ? "" : format.label);
                              item.put("selected", group.isTrackSelected(trackIndex));
                              item.put("type", type == C.TRACK_TYPE_AUDIO ? "audio" : "text");
                              (type == C.TRACK_TYPE_AUDIO ? audio : text).put(item);
                          }
                      }
                  }
                  result.put("audio", audio);
                  result.put("text", text);
                  call.resolve(result);
              }

              @PluginMethod
              public void selectTrack(PluginCall call) {
                  String typeName = call.getString("type", "audio");
                  int groupIndex = call.getData().optInt("group", -1);
                  int trackIndex = call.getData().optInt("track", -1);
                  boolean enabled = call.getData().optBoolean("enabled", true);
                  getActivity().runOnUiThread(() -> {
                      if (player == null) { call.reject("ExoPlayer no está activo"); return; }
                      int trackType = "text".equals(typeName) ? C.TRACK_TYPE_TEXT : C.TRACK_TYPE_AUDIO;
                      if (trackType == C.TRACK_TYPE_TEXT && !enabled) {
                          player.setTrackSelectionParameters(player.getTrackSelectionParameters().buildUpon()
                                  .clearOverridesOfType(trackType).setTrackTypeDisabled(trackType, true).build());
                          call.resolve();
                          return;
                      }
                      Tracks groups = player.getCurrentTracks();
                      if (groupIndex < 0 || groupIndex >= groups.getGroups().size()) {
                          call.reject("Grupo de pista no disponible"); return;
                      }
                      Tracks.Group group = groups.getGroups().get(groupIndex);
                      if (trackIndex < 0 || trackIndex >= group.length || group.getType() != trackType) {
                          call.reject("Pista no disponible"); return;
                      }
                      TrackSelectionOverride override = new TrackSelectionOverride(group.getMediaTrackGroup(), trackIndex);
                      player.setTrackSelectionParameters(player.getTrackSelectionParameters().buildUpon()
                              .clearOverridesOfType(trackType).addOverride(override)
                              .setTrackTypeDisabled(trackType, false).build());
                      call.resolve();
                  });
              }

              @PluginMethod
              public void togglePlay(PluginCall call) {
                  getActivity().runOnUiThread(() -> {
                      if (player != null) {
                          if (player.isPlaying()) player.pause();
                          else player.play();
                      }
                      call.resolve();
                  });
              }

              @PluginMethod
              public void pause(PluginCall call) {
                  getActivity().runOnUiThread(() -> {
                      if (player != null) player.pause();
                      call.resolve();
                  });
              }

              @PluginMethod
              public void resume(PluginCall call) {
                  getActivity().runOnUiThread(() -> {
                      if (player != null) player.play();
                      call.resolve();
                  });
              }

              @PluginMethod
              public void seekTo(PluginCall call) {
                  double pos = call.getDouble("position", 0.0);
                  getActivity().runOnUiThread(() -> {
                      if (player != null) {
                          player.seekTo((long) (pos * 1000L));
                      }
                      call.resolve();
                  });
              }

              @PluginMethod
              public void stop(PluginCall call) {
                  getActivity().runOnUiThread(() -> {
                      stopPlayback();
                      call.resolve();
                  });
              }

              private void startProgressTimer() {
                  stopProgressTimer();
                  progressRunnable = new Runnable() {
                      @Override
                      public void run() {
                          if (player != null) {
                              long cur = player.getCurrentPosition();
                              long dur = player.getDuration();
                              JSObject ret = new JSObject();
                              ret.put("currentTime", cur / 1000.0);
                              ret.put("duration", dur > 0 ? dur / 1000.0 : 0.0);
                              ret.put("isPlaying", player.isPlaying());
                              notifyListeners("onPlaybackProgress", ret);
                          }
                          progressHandler.postDelayed(this, 500);
                      }
                  };
                  progressHandler.post(progressRunnable);
              }

              private void stopProgressTimer() {
                  if (progressHandler != null && progressRunnable != null) {
                      progressHandler.removeCallbacks(progressRunnable);
                  }
              }

              private void stopPlayback() {
                  stopProgressTimer();
                  if (streamServer != null) {
                      streamServer.cleanPending();
                  }
                  if (player != null) {
                      player.stop();
                      player.clearMediaItems();
                      player.release();
                      player = null;
                  }
                  if (playerView != null) {
                      ViewGroup parent = (ViewGroup) playerView.getParent();
                      if (parent != null) parent.removeView(playerView);
                      playerView = null;
                  }
                  try {
                      getBridge().getWebView().setBackgroundColor(Color.TRANSPARENT);
                  } catch (Exception ignored) {}
              }

              @Override
              protected void handleOnDestroy() {
                  super.handleOnDestroy();
                  stopPlayback();
                  if (streamServer != null) {
                      streamServer.stop();
                  }
              }
          }
          """
          with open(plugin_file, "w", encoding="utf-8") as f:
              f.write(plugin_code)
          print("ExoPlayerPlugin.java inyectado exitosamente.")

          # 3. Registrar plugin en MainActivity.java
          main_activity = os.path.join(java_pkg_dir, "MainActivity.java")
          if os.path.exists(main_activity):
              with open(main_activity, "r", encoding="utf-8") as f:
                  act = f.read()
              if "ExoPlayerPlugin" not in act:
                  replacement = (
                      "public class MainActivity extends BridgeActivity {\n"
                      "    @Override\n"
                      "    public void onCreate(android.os.Bundle savedInstanceState) {\n"
                      "        registerPlugin(ExoPlayerPlugin.class);\n"
                      "        super.onCreate(savedInstanceState);\n"
                      "    }\n"
                  )
                  act = act.replace("public class MainActivity extends BridgeActivity {", replacement, 1)
                  with open(main_activity, "w", encoding="utf-8") as f:
                      f.write(act)
                  print("MainActivity.java configurado para registrar ExoPlayerPlugin.")
          PYEOF

      - name: Setup Signing Key and Version
        env:
          IS_RELEASE: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.publish_release == 'true') || startsWith(github.ref, 'refs/tags/') }}
          RUN_NUMBER: ${{ github.run_number }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          mkdir -p android/app
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
            echo "Keystore cargado desde GitHub Secrets."
          elif [ -f android/app/release.keystore ]; then
            echo "Keystore existente encontrado en android/app/release.keystore."
          else
            echo "Generando almacén de claves permanente..."
            keytool -genkeypair -v -keystore android/app/release.keystore -alias tgvideo -keyalg RSA -keysize 2048 -validity 10000 -storepass tgvideo1234 -keypass tgvideo1234 -dname "CN=TGVideo, O=TGVideo, C=ES"
          fi

          python3 - << 'PYEOF'
          import os, re, json

          gradle_file = "android/app/build.gradle"
          pkg_file = "package.json"

          package_version = "0.1.0"
          if os.path.exists(pkg_file):
              try:
                  with open(pkg_file, "r", encoding="utf-8") as f:
                      package_version = json.load(f).get("version", "0.1.0")
              except Exception:
                  pass

          if os.path.exists(gradle_file):
              with open(gradle_file, "r", encoding="utf-8") as f:
                  content = f.read()

              signing_block = """
              signingConfigs {
                  release {
                      storeFile file('release.keystore')
                      storePassword 'tgvideo1234'
                      keyAlias 'tgvideo'
                      keyPassword 'tgvideo1234'
                  }
                  debug {
                      storeFile file('release.keystore')
                      storePassword 'tgvideo1234'
                      keyAlias 'tgvideo'
                      keyPassword 'tgvideo1234'
                  }
              }
              """
              if "signingConfigs {" not in content:
                  content = content.replace("buildTypes {", signing_block + "\n    buildTypes {")

              content = re.sub(r'buildTypes\s*\{\s*release\s*\{', 'buildTypes {\n        release {\n            signingConfig signingConfigs.release', content)
              content = re.sub(r'buildTypes\s*\{\s*debug\s*\{', 'buildTypes {\n        debug {\n            signingConfig signingConfigs.debug', content)

              is_release = os.environ.get("IS_RELEASE", "").lower() in ("true", "1")
              run_number = os.environ.get("RUN_NUMBER", "1")

              if is_release:
                  content = re.sub(r'versionCode\s+\d+', f'versionCode {run_number}', content)
                  content = re.sub(r'versionName\s+"[^"]+"', f'versionName "{package_version}"', content)
                  print(f"Modo RELEASE: version oficial {package_version} (versionCode {run_number})")
              else:
                  dev_version = f"{package_version}-dev"
                  content = re.sub(r'versionName\s+"[^"]+"', f'versionName "{dev_version}"', content)
                  print(f"Modo PRUEBA (push): versionName {dev_version}, versionCode fijo.")

              with open(gradle_file, "w", encoding="utf-8") as f:
                  f.write(content)
              print("build.gradle actualizado correctamente.")
          PYEOF

      - name: Build APK
        working-directory: android
        env:
          IS_RELEASE: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.publish_release == 'true') || startsWith(github.ref, 'refs/tags/') }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace
          if [ "$IS_RELEASE" = "true" ]; then
            cp app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/TGVideo.apk
          else
            cp app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/TGVideo-dev.apk
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ ((github.event_name == 'workflow_dispatch' && github.event.inputs.publish_release == 'true') || startsWith(github.ref, 'refs/tags/')) && 'TGVideo-apk' || 'TGVideo-dev-apk' }}
          path: android/app/build/outputs/apk/release/TGVideo*.apk
          if-no-files-found: error

      - name: Publish Official Release (Manual o Tag)
        if: (github.event_name == 'workflow_dispatch' && github.event.inputs.publish_release == 'true') || startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PKG_VER=$(node -p "require('./package.json').version || '1.0.0'")
          TAG_NAME="v${PKG_VER}"
          gh release create "$TAG_NAME" \
            android/app/build/outputs/apk/release/TGVideo.apk \
            --title "TGVideo $TAG_NAME" \
            --notes "Versión oficial de TGVideo con ExoPlayer y soporte Android TV." \
            --latest