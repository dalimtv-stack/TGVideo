name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      publish_release:
        description: '¿Publicar como Release oficial en GitHub?'
        required: false
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build web
        env:
          VITE_API_ID: ${{ secrets.VITE_API_ID }}
          VITE_API_HASH: ${{ secrets.VITE_API_HASH }}
          VITE_TMDB_DEMO_API_KEY: ${{ secrets.VITE_TMDB_DEMO_API_KEY }}
        run: npm run build

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        run: |
          ANDROID_HOME=$HOME/android-sdk
          mkdir -p "$ANDROID_HOME/cmdline-tools"

          curl -fsSL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o /tmp/cmdtools.zip
          unzip -q /tmp/cmdtools.zip -d /tmp/cmdtools
          mv /tmp/cmdtools/cmdline-tools "$ANDROID_HOME/cmdline-tools/latest"

          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

      - name: Install SDK packages
        run: |
          mkdir -p "$ANDROID_HOME/licenses"
          printf '%s\n' '24333f8a63b6825ea9c5514f83c2829b004d1fee' > "$ANDROID_HOME/licenses/android-sdk-license"
          sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Capacitor android
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Setup Signing Key and Version
        env:
          RUN_NUMBER: ${{ github.run_number }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
            echo "Keystore permanente cargado desde GitHub Secrets."
          else
            echo "Aviso: KEYSTORE_BASE64 no configurado en Secrets. Generando clave temporal."
            keytool -genkeypair -v -keystore android/app/release.keystore -alias tgvideo -keyalg RSA -keysize 2048 -validity 10000 -storepass tgvideo1234 -keypass tgvideo1234 -dname "CN=TGVideo"
          fi

          python3 - << 'PYEOF'
          import os, re
          gradle_file = "android/app/build.gradle"
          with open(gradle_file, "r", encoding="utf-8") as f:
              content = f.read()

          signing_block = """
              signingConfigs {
                  release {
                      storeFile file('release.keystore')
                      storePassword 'tgvideo1234'
                      keyAlias 'tgvideo'
                      keyPassword 'tgvideo1234'
                  }
                  debug {
                      storeFile file('release.keystore')
                      storePassword 'tgvideo1234'
                      keyAlias 'tgvideo'
                      keyPassword 'tgvideo1234'
                  }
              }
          """
          if "signingConfigs {" not in content:
              content = content.replace("buildTypes {", signing_block + "\n    buildTypes {")

          content = re.sub(r'buildTypes\s*\{\s*release\s*\{', 'buildTypes {\n        release {\n            signingConfig signingConfigs.release', content)
          content = re.sub(r'buildTypes\s*\{\s*debug\s*\{', 'buildTypes {\n        debug {\n            signingConfig signingConfigs.debug', content)

          run_number = os.environ.get("RUN_NUMBER", "1")
          content = re.sub(r'versionCode\s+\d+', f'versionCode {run_number}', content)
          content = re.sub(r'versionName\s+"[^"]+"', f'versionName "1.0.{run_number}"', content)

          with open(gradle_file, "w", encoding="utf-8") as f:
              f.write(content)
          print(f"build.gradle actualizado: firma persistente aplicada y versionCode={run_number}")
          PYEOF

      - name: Build APKs
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease assembleDebug --no-daemon --stacktrace
          cp app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/TGVideo.apk

      - uses: actions/upload-artifact@v4
        with:
          name: tgvideo-apks
          path: |
            android/app/build/outputs/apk/release/TGVideo.apk
            android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        if: (github.event_name == 'workflow_dispatch' && github.event.inputs.publish_release == 'true') || startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="v1.0.${{ github.run_number }}"
          gh release create "$TAG_NAME" \
            android/app/build/outputs/apk/release/TGVideo.apk \
            --title "TGVideo $TAG_NAME" \
            --notes "Nueva versión automática de TGVideo. Firma fija para actualizar sin desinstalar." \
            --latest
