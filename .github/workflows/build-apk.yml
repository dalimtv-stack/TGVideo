name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      publish_release:
        description: '¿Publicar como Release oficial en GitHub?'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build web
        env:
          VITE_API_ID: ${{ secrets.VITE_API_ID }}
          VITE_API_HASH: ${{ secrets.VITE_API_HASH }}
          VITE_TMDB_DEMO_API_KEY: ${{ secrets.VITE_TMDB_DEMO_API_KEY }}
        run: npm run build

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        run: |
          ANDROID_HOME=$HOME/android-sdk
          mkdir -p "$ANDROID_HOME/cmdline-tools"

          curl -fsSL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o /tmp/cmdtools.zip
          unzip -q /tmp/cmdtools.zip -d /tmp/cmdtools
          mv /tmp/cmdtools/cmdline-tools "$ANDROID_HOME/cmdline-tools/latest"

          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

      - name: Install SDK packages
        run: |
          mkdir -p "$ANDROID_HOME/licenses"
          printf '%s\n' '24333f8a63b6825ea9c5514f83c2829b004d1fee' > "$ANDROID_HOME/licenses/android-sdk-license"
          sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Capacitor android
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Prepare Android TV Icons, Splash, Manifest & ExoPlayer Integration
        run: |
          pip install Pillow
          python3 - << 'PYEOF'
          import os, re, shutil
          from PIL import Image

          src_path = "public/icons/icon-512.png"
          res_base = "android/app/src/main/res"

          if os.path.exists(src_path):
              print(f"Generando iconos y splash desde {src_path}...")
              src = Image.open(src_path).convert("RGBA")

              sizes = {
                  "mipmap-mdpi": 48,
                  "mipmap-hdpi": 72,
                  "mipmap-xhdpi": 96,
                  "mipmap-xxhdpi": 144,
                  "mipmap-xxxhdpi": 192,
              }

              for folder, size in sizes.items():
                  folder_path = os.path.join(res_base, folder)
                  os.makedirs(folder_path, exist_ok=True)
                  resized = src.resize((size, size), Image.Resampling.LANCZOS)
                  for name in ["ic_launcher.png", "ic_launcher_round.png", "ic_launcher_foreground.png"]:
                      resized.save(os.path.join(folder_path, name))

              drawable_path = os.path.join(res_base, "drawable")
              os.makedirs(drawable_path, exist_ok=True)

              # Banner Android TV / Fire TV (320x180): usar el icono landscape oficial si existe
              landscape_src = "public/icons/icon-landscape.alt.png"
              if not os.path.exists(landscape_src):
                  landscape_src = "public/icons/icon-landscape.png"

              if os.path.exists(landscape_src):
                  print(f"Usando icono landscape 16:9 oficial desde {landscape_src}...")
                  b_src = Image.open(landscape_src).convert("RGBA")
                  b_res = b_src.resize((320, 180), Image.Resampling.LANCZOS)
                  b_res.save(os.path.join(drawable_path, "banner.png"))
                  xhdpi_path = os.path.join(res_base, "drawable-xhdpi")
                  os.makedirs(xhdpi_path, exist_ok=True)
                  b_res.save(os.path.join(xhdpi_path, "banner.png"))
              else:
                  from PIL import ImageOps
                  banner = ImageOps.fit(src, (320, 180), Image.Resampling.LANCZOS)
                  banner.save(os.path.join(drawable_path, "banner.png"))

              # Reemplazar splash de Capacitor
              for root, dirs, files in os.walk(res_base):
                  for file in files:
                      if file.lower() == "splash.png":
                          target_splash = os.path.join(root, file)
                          try:
                              with Image.open(target_splash) as existing:
                                  w, h = existing.size
                              splash_bg = Image.new("RGBA", (w, h), (20, 20, 20, 255))
                              icon_size = min(w, h) // 3
                              icon_splash = src.resize((icon_size, icon_size), Image.Resampling.LANCZOS)
                              sp_offset = ((w - icon_size) // 2, (h - icon_size) // 2)
                              splash_bg.paste(icon_splash, sp_offset, icon_splash)
                              splash_bg.save(target_splash)
                          except Exception as e:
                              print(f"Error actualizando splash: {e}")

              print("Iconos, banner 16:9 y splash screens listos.")

          manifest_path = "android/app/src/main/AndroidManifest.xml"
          if os.path.exists(manifest_path):
              with open(manifest_path, "r", encoding="utf-8") as f:
                  m = f.read()

              if "android.software.leanback" not in m:
                  m = re.sub(
                      r'(<manifest[^>]*>)',
                      r'\1\n    <uses-feature android:name="android.software.leanback" android:required="false" />\n    <uses-feature android:name="android.hardware.touchscreen" android:required="false" />',
                      m,
                      count=1
                  )

              if 'android:banner=' not in m:
                  m = re.sub(r'<application\b', '<application android:banner="@drawable/banner" android:isGame="false"', m, count=1)

              def inject_activity_banner(match):
                  tag = match.group(0)
                  if 'android:banner=' not in tag:
                      return tag[:-1] + ' android:banner="@drawable/banner">'
                  return tag

              m = re.sub(r'<activity\b[^>]*MainActivity[^>]*>', inject_activity_banner, m, count=1)

              if "LEANBACK_LAUNCHER" not in m:
                  m = re.sub(
                      r'(<category\s+android:name="android\.intent\.category\.LAUNCHER"\s*/>)',
                      r'\1\n                <category android:name="android.intent.category.LEANBACK_LAUNCHER" />',
                      m,
                      count=1
                  )

              with open(manifest_path, "w", encoding="utf-8") as f:
                  f.write(m)
              print("AndroidManifest.xml configurado para Leanback / Android TV.")

          # Fondo negro para estilos
          for styles_path in ["android/app/src/main/res/values/styles.xml", "android/app/src/main/res/values-night/styles.xml"]:
              if os.path.exists(styles_path):
                  with open(styles_path, "r", encoding="utf-8") as f:
                      st = f.read()
                  if "android:windowBackground" in st:
                      st = re.sub(r'<item name="android:windowBackground">[^<]+</item>', '<item name="android:windowBackground">@android:color/black</item>', st)
                  else:
                      st = st.replace("</style>", '    <item name="android:windowBackground">@android:color/black</item>\n    </style>')
                  with open(styles_path, "w", encoding="utf-8") as f:
                      f.write(st)

          # Inyectar dependencias de ExoPlayer (Media3) en build.gradle
          app_gradle = "android/app/build.gradle"
          if os.path.exists(app_gradle):
              with open(app_gradle, "r", encoding="utf-8") as f:
                  g = f.read()
              if "androidx.media3:media3-exoplayer" not in g:
                  media3_deps = """
    implementation 'androidx.media3:media3-exoplayer:1.5.1'
    implementation 'androidx.media3:media3-ui:1.5.1'
    implementation 'androidx.media3:media3-common:1.5.1'
"""
                  g = re.sub(r'dependencies\s*\{', 'dependencies {' + media3_deps, g, count=1)
                  with open(app_gradle, "w", encoding="utf-8") as f:
                      f.write(g)
                  print("Dependencias de ExoPlayer Media3 agregadas a build.gradle.")

          # Inyectar plugin nativo ExoPlayerPlugin.java en com.tgvideo.app
          java_pkg_dir = "android/app/src/main/java/com/tgvideo/app"
          os.makedirs(java_pkg_dir, exist_ok=True)
          plugin_path = os.path.join(java_pkg_dir, "ExoPlayerPlugin.java")

          exoplayer_plugin_code = """package com.tgvideo.app;

import android.graphics.Color;
import android.net.Uri;
import android.os.Handler;
import android.os.Looper;
import android.view.ViewGroup;
import android.widget.FrameLayout;

import androidx.media3.common.MediaItem;
import androidx.media3.common.Player;
import androidx.media3.common.TrackGroup;
import androidx.media3.common.Tracks;
import androidx.media3.exoplayer.ExoPlayer;
import androidx.media3.exoplayer.trackselection.DefaultTrackSelector;
import androidx.media3.ui.PlayerView;

import com.getcapacitor.JSArray;
import com.getcapacitor.JSObject;
import com.getcapacitor.Plugin;
import com.getcapacitor.PluginCall;
import com.getcapacitor.PluginMethod;
import com.getcapacitor.annotation.CapacitorPlugin;

@CapacitorPlugin(name = "ExoPlayerPlugin")
public class ExoPlayerPlugin extends Plugin {
    private ExoPlayer player;
    private PlayerView playerView;
    private DefaultTrackSelector trackSelector;
    private Handler progressHandler;
    private Runnable progressRunnable;

    @Override
    public void load() {
        super.load();
        progressHandler = new Handler(Looper.getMainLooper());
    }

    @PluginMethod
    public void play(PluginCall call) {
        String url = call.getString("url");
        long resumeAt = call.getInt("resumeAt", 0) * 1000L;

        getActivity().runOnUiThread(() -> {
            try {
                if (player == null) {
                    trackSelector = new DefaultTrackSelector(getContext());
                    player = new ExoPlayer.Builder(getContext())
                        .setTrackSelector(trackSelector)
                        .build();

                    playerView = new PlayerView(getContext());
                    playerView.setPlayer(player);
                    playerView.setUseController(false);

                    FrameLayout.LayoutParams params = new FrameLayout.LayoutParams(
                        ViewGroup.LayoutParams.MATCH_PARENT,
                        ViewGroup.LayoutParams.MATCH_PARENT
                    );

                    // Colocar vista de video detras del WebView transparente
                    ViewGroup parent = (ViewGroup) getBridge().getWebView().getParent();
                    int webViewIndex = parent.indexOfChild(getBridge().getWebView());
                    parent.addView(playerView, webViewIndex, params);
                    getBridge().getWebView().setBackgroundColor(Color.TRANSPARENT);

                    player.addListener(new Player.Listener() {
                        @Override
                        public void onPlaybackStateChanged(int state) {
                            JSObject ret = new JSObject();
                            if (state == Player.STATE_READY) {
                                ret.put("state", "READY");
                                ret.put("duration", player.getDuration() / 1000.0);
                                notifyListeners("onStateChanged", ret);
                                sendTracks();
                            } else if (state == Player.STATE_ENDED) {
                                ret.put("state", "ENDED");
                                notifyListeners("onStateChanged", ret);
                            }
                        }

                        @Override
                        public void onIsPlayingChanged(boolean isPlaying) {
                            JSObject ret = new JSObject();
                            ret.put("state", isPlaying ? "PLAYING" : "PAUSED");
                            notifyListeners("onStateChanged", ret);
                        }

                        @Override
                        public void onTracksChanged(Tracks tracks) {
                            sendTracks();
                        }
                    });

                    startProgress();
                }

                MediaItem mediaItem = MediaItem.fromUri(Uri.parse(url));
                player.setMediaItem(mediaItem);
                if (resumeAt > 0) player.seekTo(resumeAt);
                player.prepare();
                player.play();

                call.resolve();
            } catch (Exception e) {
                call.reject("Error inicializando ExoPlayer: " + e.getMessage());
            }
        });
    }

    private void sendTracks() {
        if (player == null) return;
        JSObject ret = new JSObject();
        JSArray audioArr = new JSArray();
        JSArray textArr = new JSArray();

        Tracks tracks = player.getCurrentTracks();
        for (Tracks.Group group : tracks.getGroups()) {
            TrackGroup tg = group.getMediaTrackGroup();
            for (int i = 0; i < tg.length; i++) {
                JSObject tObj = new JSObject();
                tObj.put("index", i);
                tObj.put("label", tg.getFormat(i).label);
                tObj.put("language", tg.getFormat(i).language);
                tObj.put("selected", group.isTrackSelected(i));

                if (group.getType() == androidx.media3.common.C.TRACK_TYPE_AUDIO) {
                    audioArr.put(tObj);
                } else if (group.getType() == androidx.media3.common.C.TRACK_TYPE_TEXT) {
                    textArr.put(tObj);
                }
            }
        }
        ret.put("audio", audioArr);
        ret.put("text", textArr);
        notifyListeners("onTracks", ret);
    }

    private void startProgress() {
        progressRunnable = new Runnable() {
            @Override
            public void run() {
                if (player != null && player.isPlaying()) {
                    JSObject ret = new JSObject();
                    ret.put("currentTime", player.getCurrentPosition() / 1000.0);
                    ret.put("duration", player.getDuration() / 1000.0);
                    notifyListeners("onTimeUpdate", ret);
                }
                progressHandler.postDelayed(this, 500);
            }
        };
        progressHandler.post(progressRunnable);
    }

    @PluginMethod
    public void pause(PluginCall call) {
        getActivity().runOnUiThread(() -> {
            if (player != null) player.pause();
            call.resolve();
        });
    }

    @PluginMethod
    public void resume(PluginCall call) {
        getActivity().runOnUiThread(() -> {
            if (player != null) player.play();
            call.resolve();
        });
    }

    @PluginMethod
    public void seek(PluginCall call) {
        double time = call.getDouble("time", 0.0);
        getActivity().runOnUiThread(() -> {
            if (player != null) player.seekTo((long) (time * 1000));
            call.resolve();
        });
    }

    @PluginMethod
    public void stop(PluginCall call) {
        getActivity().runOnUiThread(() -> {
            cleanup();
            if (call != null) call.resolve();
        });
    }

    private void cleanup() {
        if (progressHandler != null && progressRunnable != null) {
            progressHandler.removeCallbacks(progressRunnable);
        }
        if (player != null) {
            player.stop();
            player.release();
            player = null;
        }
        if (playerView != null) {
            ViewGroup parent = (ViewGroup) playerView.getParent();
            if (parent != null) parent.removeView(playerView);
            playerView = null;
        }
        if (getBridge() != null && getBridge().getWebView() != null) {
            getBridge().getWebView().setBackgroundColor(Color.BLACK);
        }
    }

    @Override
    protected void handleOnDestroy() {
        cleanup();
        super.handleOnDestroy();
    }
}
"""
          with open(plugin_path, "w", encoding="utf-8") as f:
              f.write(exoplayer_plugin_code)
          print("ExoPlayerPlugin.java creado e inyectado correctamente.")

          # Registrar ExoPlayerPlugin en MainActivity.java
          main_activity = os.path.join(java_pkg_dir, "MainActivity.java")
          if os.path.exists(main_activity):
              with open(main_activity, "r", encoding="utf-8") as f:
                  act = f.read()
              if "ExoPlayerPlugin" not in act:
                  act = act.replace("public class MainActivity extends BridgeActivity {", "public class MainActivity extends BridgeActivity {\n    @Override\n    public void onCreate(android.os.Bundle savedInstanceState) {\n        registerPlugin(ExoPlayerPlugin.class);\n        super.onCreate(savedInstanceState);\n    }")
                  with open(main_activity, "w", encoding="utf-8") as f:
                      f.write(act)
                  print("MainActivity.java configurado para registrar ExoPlayerPlugin.")
          PYEOF

      - name: Setup Signing Key and Version
        env:
          IS_RELEASE: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.publish_release == 'true') || startsWith(github.ref, 'refs/tags/') }}
          RUN_NUMBER: ${{ github.run_number }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          mkdir -p android/app
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
            echo "Keystore cargado desde GitHub Secrets."
          elif [ -f android/app/release.keystore ]; then
            echo "Keystore existente encontrado en android/app/release.keystore."
          else
            echo "Generando almacén de claves permanente..."
            keytool -genkeypair -v -keystore android/app/release.keystore -alias tgvideo -keyalg RSA -keysize 2048 -validity 10000 -storepass tgvideo1234 -keypass tgvideo1234 -dname "CN=TGVideo, O=TGVideo, C=ES"
          fi

          python3 - << 'PYEOF'
          import os, re, json

          gradle_file = "android/app/build.gradle"
          pkg_file = "package.json"

          package_version = "0.1.0"
          if os.path.exists(pkg_file):
              try:
                  with open(pkg_file, "r", encoding="utf-8") as f:
                      package_version = json.load(f).get("version", "0.1.0")
              except Exception:
                  pass

          if os.path.exists(gradle_file):
              with open(gradle_file, "r", encoding="utf-8") as f:
                  content = f.read()

              signing_block = """
              signingConfigs {
                  release {
                      storeFile file('release.keystore')
                      storePassword 'tgvideo1234'
                      keyAlias 'tgvideo'
                      keyPassword 'tgvideo1234'
                  }
                  debug {
                      storeFile file('release.keystore')
                      storePassword 'tgvideo1234'
                      keyAlias 'tgvideo'
                      keyPassword 'tgvideo1234'
                  }
              }
              """
              if "signingConfigs {" not in content:
                  content = content.replace("buildTypes {", signing_block + "\n    buildTypes {")

              content = re.sub(r'buildTypes\s*\{\s*release\s*\{', 'buildTypes {\n        release {\n            signingConfig signingConfigs.release', content)
              content = re.sub(r'buildTypes\s*\{\s*debug\s*\{', 'buildTypes {\n        debug {\n            signingConfig signingConfigs.debug', content)

              is_release = os.environ.get("IS_RELEASE", "").lower() in ("true", "1")
              run_number = os.environ.get("RUN_NUMBER", "1")

              if is_release:
                  # Publicación oficial: versión tomada de package.json
                  content = re.sub(r'versionCode\s+\d+', f'versionCode {run_number}', content)
                  content = re.sub(r'versionName\s+"[^"]+"', f'versionName "{package_version}"', content)
                  print(f"Modo RELEASE: version oficial {package_version} (versionCode {run_number})")
              else:
                  # APK de prueba (push): sufijo -dev sin incrementar versión oficial ni generar tag de release
                  dev_version = f"{package_version}-dev"
                  content = re.sub(r'versionName\s+"[^"]+"', f'versionName "{dev_version}"', content)
                  print(f"Modo PRUEBA (push): versionName {dev_version}, versionCode fijo.")

              with open(gradle_file, "w", encoding="utf-8") as f:
                  f.write(content)
              print("build.gradle actualizado correctamente.")
          PYEOF

      - name: Build APK
        working-directory: android
        env:
          IS_RELEASE: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.publish_release == 'true') || startsWith(github.ref, 'refs/tags/') }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace
          if [ "$IS_RELEASE" = "true" ]; then
            cp app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/TGVideo.apk
          else
            cp app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/TGVideo-dev.apk
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ ((github.event_name == 'workflow_dispatch' && github.event.inputs.publish_release == 'true') || startsWith(github.ref, 'refs/tags/')) && 'TGVideo-apk' || 'TGVideo-dev-apk' }}
          path: android/app/build/outputs/apk/release/TGVideo*.apk
          if-no-files-found: error

      - name: Publish Official Release (Manual o Tag)
        if: (github.event_name == 'workflow_dispatch' && github.event.inputs.publish_release == 'true') || startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PKG_VER=$(node -p "require('./package.json').version || '1.0.0'")
          TAG_NAME="v${PKG_VER}"
          gh release create "$TAG_NAME" \
            android/app/build/outputs/apk/release/TGVideo.apk \
            --title "TGVideo $TAG_NAME" \
            --notes "Versión oficial de TGVideo con ExoPlayer y soporte Android TV." \
            --latest

      - name: Update Rolling Debug Release (Automático en Push)
        if: github.event_name == 'push'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "debug" \
            android/app/build/outputs/apk/release/TGVideo-dev.apk \
            --title "TGVideo (Versión de Prueba / Debug)" \
            --notes "APK de prueba compilada automáticamente desde el último commit de main. No incrementa la versión oficial." \
            --prerelease \
            --clobber || gh release upload "debug" android/app/build/outputs/apk/release/TGVideo-dev.apk --clobber
