name: Generar Keystore Permanente

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generar Keystore
        run: |
          keytool -genkeypair -v \
            -keystore release.keystore \
            -alias tgvideo \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass tgvideo1234 \
            -keypass tgvideo1234 \
            -dname "CN=TGVideo, OU=App, O=TGVideo, L=Madrid, ST=Madrid, C=ES"

          B64=$(base64 -w 0 release.keystore)
          echo "### Tu clave permanente de firma (copia todo el texto de abajo):" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "$B64" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "Guárdala en GitHub: **Settings -> Secrets and variables -> Actions -> New repository secret** con nombre **KEYSTORE_BASE64** y contraseña **tgvideo1234**" >> $GITHUB_STEP_SUMMARY
